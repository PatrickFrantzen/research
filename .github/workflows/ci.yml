# CI-Gate für Frontend und Backend (Issue #56): Lint, Tests und Build laufen
# bei jedem Pull Request und jedem Push auf main, dazu E2E- und AXE-Tests
# gegen den echten Stack (Issues #54, #62). Node-Version wie im Dockerfile.
# Befehle identisch zum Abschnitt „Qualitätschecks“ in der README.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # --legacy-peer-deps wie im Dockerfile (@nest-lab/throttler-storage-redis
      # deklariert NestJS 12 noch nicht als Peer).
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run lint
      # Umfasst auch test/ und alle Specs (Issue #74), die nest build und
      # Vitest nicht typprüfen.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Playwright gegen Backend + Postgres + Redis + MinIO, das Backend liefert
  # den Frontend-Build aus. Datenbank, Rate-Limit-Zähler und Bucket bereitet
  # frontend/e2e/stack.sh vor. Zugangsdaten sind reine Testwerte.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research -d research_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # MinIO braucht ein Startkommando, das Service-Container nicht erlauben.
      - name: MinIO starten
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=research -e MINIO_ROOT_PASSWORD=research-secret \
            cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend bauen
        working-directory: backend
        run: |
          npm ci --legacy-peer-deps
          npx prisma generate
          npm run build
      - name: Frontend bauen
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Playwright-Browser installieren
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Auf MinIO warten
        run: curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://localhost:9000/minio/health/live
      - name: E2E- und AXE-Tests
        working-directory: frontend
        run: npm run e2e
      # Report, Traces und Screenshots nur bei Fehlern (Issue #62).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            !frontend/test-results/.auth
          retention-days: 14
