# CI-Gate für Frontend und Backend (Issue #56): Lint, Tests und Build laufen
# bei jedem Pull Request und jedem Push auf main. Node-Version wie im
# Dockerfile. Befehle identisch zum Abschnitt „Qualitätschecks“ in der README.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # --legacy-peer-deps wie im Dockerfile (@nest-lab/throttler-storage-redis
      # deklariert NestJS 12 noch nicht als Peer).
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run lint
      # Umfasst auch test/ und alle Specs (Issue #74), die nest build und
      # Vitest nicht typprüfen.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
