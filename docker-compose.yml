services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Dieses Compose-Setup läuft ohne Reverse-Proxy/TLS direkt auf
      # http://localhost:3000 (siehe README.md, docs/research/02-architektur.md).
      # Das Dockerfile setzt NODE_ENV=production standardmäßig (für den
      # echten Produktivbetrieb hinter einem TLS-terminierenden Reverse-Proxy
      # des Kunden) – das würde hier lokal "Secure"-Cookies erzeugen, die der
      # Browser über HTTP verwirft und den Login-Cookie sofort verliert.
      NODE_ENV: development
      DATABASE_URL: postgres://research:research@postgres:5432/research
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      # Browser ruft Foto-URLs direkt auf, kennt "minio" als Docker-internen
      # Hostnamen aber nicht – siehe minio-Port-Mapping unten.
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      OBJECT_STORAGE_REGION: us-east-1
      # Dedizierter, auf den Fotos-Bucket beschränkter User statt
      # MinIO-Root-Credentials (Issue #36) – angelegt von minio-init.
      OBJECT_STORAGE_ACCESS_KEY_ID: research-app
      OBJECT_STORAGE_SECRET_ACCESS_KEY: research-app-secret
      OBJECT_STORAGE_BUCKET: research-fotos
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_ISSUER: ${JWT_ISSUER:-research-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-research-frontend}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Geteilter Rate-Limit-Zähler für @nestjs/throttler statt In-Memory, damit
  # das Limit auch über mehrere App-Instanzen hinweg gilt (Issue #41).
  redis:
    image: redis:8.8.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Schema-Migration + Stammdaten-/Bootstrap-Seed, läuft einmal vor dem
  # Start der App (siehe backend/prisma/).
  migrate:
    build: .
    environment:
      DATABASE_URL: postgres://research:research@postgres:5432/research
      INITIAL_NUTZER_EMAIL: ${INITIAL_NUTZER_EMAIL:-nutzer@example.com}
      INITIAL_NUTZER_PASSWORT: ${INITIAL_NUTZER_PASSWORT:-change-me-now}
      INITIAL_NUTZER_STANDORT: Hauptsitz
    entrypoint: sh -c "npx prisma migrate deploy && npm run db:seed"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    # MinIO veröffentlicht keine Community-Images mehr, quay.io verlangt seit
    # 24.09.2026 Anmeldung (Issue #83). Chainguard baut MinIO aus dem Quellcode,
    # kostenlos nur als `latest`, daher per Digest gepinnt.
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    # Chainguard läuft standardmäßig als UID 65532; bestehende Volumes wurden
    # vom alten Image als root beschrieben, daher weiterhin root.
    user: "0:0"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: research
      MINIO_ROOT_PASSWORD: research-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Legt den Bucket an und einen dedizierten, auf genau diesen Bucket
  # beschränkten App-User – die App selbst bekommt nie die MinIO-Root-
  # Credentials zu sehen (Issue #36).
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      bash -c "
        mc alias set local http://minio:9000 research research-secret &&
        mc mb --ignore-existing local/research-fotos &&
        (mc admin user add local research-app research-app-secret || true) &&
        echo '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::research-fotos\",\"arn:aws:s3:::research-fotos/*\"]}]}' > /tmp/research-app-policy.json &&
        mc admin policy create local research-app-policy /tmp/research-app-policy.json &&
        mc admin policy attach local research-app-policy --user research-app
      "

volumes:
  postgres-data:
  minio-data:
