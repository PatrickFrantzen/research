services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://research:research@postgres:5432/research
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ACCESS_KEY_ID: research
      OBJECT_STORAGE_SECRET_ACCESS_KEY: research-secret
      OBJECT_STORAGE_BUCKET: research-fotos
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Schema-Migration + Stammdaten-/Bootstrap-Seed, läuft einmal vor dem
  # Start der App (siehe backend/prisma/).
  migrate:
    build: .
    environment:
      DATABASE_URL: postgres://research:research@postgres:5432/research
      INITIAL_VORGESETZTER_EMAIL: ${INITIAL_VORGESETZTER_EMAIL:-vorgesetzter@example.com}
      INITIAL_VORGESETZTER_PASSWORT: ${INITIAL_VORGESETZTER_PASSWORT:-change-me-now}
      INITIAL_VORGESETZTER_STANDORT: Hauptsitz
    entrypoint: sh -c "npx prisma migrate deploy && npm run db:seed"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: research
      MINIO_ROOT_PASSWORD: research-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 research research-secret &&
        mc mb --ignore-existing local/research-fotos
      "

volumes:
  postgres-data:
  minio-data:
