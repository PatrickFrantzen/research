# Dienste für die lokalen E2E- und AXE-Tests (Issue #112). Images und Werte
# wie im CI-Job "e2e" (.github/workflows/ci.yml) und den Standardwerten in
# frontend/e2e/stack.sh; bei Änderungen alle drei Stellen anpassen.
# Zugangsdaten sind reine Testwerte. Ohne Volumes: jeder Neustart ist leer,
# stack.sh setzt die Datenbank ohnehin vor jedem Lauf zurück.
#
# Start: docker compose -f docker-compose.e2e.yml up -d --wait
# Ende:  docker compose -f docker-compose.e2e.yml down

name: research-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research_e2e
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: server /data
    environment:
      MINIO_ROOT_USER: research
      MINIO_ROOT_PASSWORD: research-secret
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
