<mat-toolbar class="desktop-toolbar">
  <a class="marken-link" routerLink="/" aria-label="RE-SEARCH Startseite">
    <img class="marke" src="brand/re-search-header.svg" alt="RE-SEARCH – Transparente Entsorgungswege" />
  </a>
  <span class="spacer"></span>
  <a mat-button routerLink="/wareneintraege" routerLinkActive="aktiv">Wareneinträge</a>
  <a mat-button routerLink="/wareneintrag-erfassen" routerLinkActive="aktiv">Wareneintrag erfassen</a>
  <a mat-button routerLink="/nutzer-anlegen" routerLinkActive="aktiv">Nutzer anlegen</a>
  <a mat-button routerLink="/einstellungen" routerLinkActive="aktiv">Einstellungen</a>
  <button mat-button type="button" (click)="logout()">Logout</button>
</mat-toolbar>

<mat-toolbar class="mobile-titelleiste">
  <a class="marken-link" routerLink="/" aria-label="RE-SEARCH Startseite">
    <img class="marke" src="brand/re-search-header.svg" alt="RE-SEARCH – Transparente Entsorgungswege" />
  </a>
</mat-toolbar>

<div class="inhalt">
  <router-outlet />
</div>

<!-- Nur Desktop; auf Mobil ist das Impressum über die Einstellungen erreichbar (Issue #21). -->
<footer class="desktop-footer">
  <a routerLink="/impressum">Impressum</a>
</footer>

<nav class="bottom-nav">
  <a routerLink="/wareneintraege" routerLinkActive="aktiv" class="bottom-nav-item">
    <mat-icon>list_alt</mat-icon>
    <span>Wareneinträge</span>
  </a>
  <a routerLink="/wareneintrag-erfassen" routerLinkActive="aktiv" class="bottom-nav-item">
    <mat-icon>add_circle</mat-icon>
    <span>Erfassen</span>
  </a>
  <button type="button" class="bottom-nav-item" (click)="mehrOeffnen()">
    <mat-icon>more_horiz</mat-icon>
    <span>Mehr</span>
  </button>
</nav>
