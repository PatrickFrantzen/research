<mat-toolbar class="desktop-toolbar">
  <a class="marken-link" routerLink="/" aria-label="RE-SEARCH Startseite">
    <img class="marke" ngSrc="brand/re-search-header.svg" width="210" height="46" priority alt="RE-SEARCH – Transparente Entsorgungswege" />
  </a>
  <span class="spacer"></span>
  <a matButton routerLink="/wareneintraege" routerLinkActive="aktiv" ariaCurrentWhenActive="page">Wareneinträge</a>
  <a matButton routerLink="/wareneintrag-erfassen" routerLinkActive="aktiv" ariaCurrentWhenActive="page">Wareneintrag erfassen</a>
  <a matButton routerLink="/nutzer-anlegen" routerLinkActive="aktiv" ariaCurrentWhenActive="page">Nutzer anlegen</a>
  <a matButton routerLink="/einstellungen" routerLinkActive="aktiv" ariaCurrentWhenActive="page">Einstellungen</a>
  <button
    matIconButton
    type="button"
    data-testid="farbmodus-umschalten"
    [attr.aria-label]="themeService.modus() === 'dunkel' ? 'Helles Design aktivieren' : 'Dunkles Design aktivieren'"
    (click)="themeService.umschalten()"
  >
    <mat-icon>{{ themeService.modus() === 'dunkel' ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
  <button matButton type="button" (click)="logout()">Logout</button>
</mat-toolbar>

<mat-toolbar class="mobile-titelleiste">
  <a class="marken-link" routerLink="/" aria-label="RE-SEARCH Startseite">
    <img class="marke" ngSrc="brand/re-search-header.svg" width="210" height="46" priority alt="RE-SEARCH – Transparente Entsorgungswege" />
  </a>
</mat-toolbar>

<div class="inhalt">
  <router-outlet />
</div>

<!-- Nur Desktop; auf Mobil ist das Impressum über die Einstellungen erreichbar (Issue #21). -->
<footer class="desktop-footer">
  <a matButton routerLink="/impressum">Impressum</a>
</footer>

<nav class="bottom-nav" aria-label="Hauptnavigation">
  <a routerLink="/wareneintraege" routerLinkActive="aktiv" ariaCurrentWhenActive="page" class="bottom-nav-item">
    <mat-icon>list_alt</mat-icon>
    <span>Wareneinträge</span>
  </a>
  <a routerLink="/wareneintrag-erfassen" routerLinkActive="aktiv" ariaCurrentWhenActive="page" class="bottom-nav-item">
    <mat-icon>add_circle</mat-icon>
    <span>Erfassen</span>
  </a>
  <button type="button" class="bottom-nav-item" (click)="mehrOeffnen()">
    <mat-icon>more_horiz</mat-icon>
    <span>Mehr</span>
  </button>
</nav>
