<h2 mat-dialog-title>Wareneintrag bearbeiten</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline">
    <mat-label>AVV-Code</mat-label>
    <input
      matInput
      #avvSuche
      data-testid="bearbeiten-avv-suche"
      [matAutocomplete]="avvAuto"
      [value]="avvSucheAnzeige"
      (input)="onAvvSucheEingabe(avvSuche.value)"
    />
    <mat-autocomplete #avvAuto="matAutocomplete" (optionSelected)="onAvvCodeAusgewaehlt($event)">
      @for (avvCode of avvTreffer.value(); track avvCode.id) {
        <mat-option [value]="avvCode.id">{{ avvCode.code }} – {{ avvCode.bezeichnung }}</mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Freitext</mat-label>
    <textarea matInput data-testid="bearbeiten-freitext" [formField]="bearbeitenForm.freitext" rows="4"></textarea>
  </mat-form-field>

  @for (kachel of fotoKacheln; track kachel.ansicht) {
    <label>
      {{ kachel.label }} ersetzen
      <input
        type="file"
        [attr.data-testid]="'bearbeiten-foto-' + kachel.ansicht"
        accept="image/jpeg,image/png,image/webp"
        (change)="fotoErsetzen(kachel.ansicht, $event)"
      />
    </label>
  }

  @if (fehler(); as meldung) {
    <p class="fehler">{{ meldung }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" data-testid="bearbeiten-abbrechen" (click)="abbrechen()">Abbrechen</button>
  <button
    mat-raised-button
    color="primary"
    type="button"
    data-testid="bearbeiten-speichern"
    [disabled]="!kannSpeichern"
    (click)="speichern()"
  >
    Speichern
  </button>
</mat-dialog-actions>
