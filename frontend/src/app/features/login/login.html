<main class="seite seite-zentriert" aria-labelledby="login-ueberschrift">
  <div class="login-inhalt">
    <img class="login-logo" ngSrc="brand/re-search-large.svg" width="620" height="137" priority alt="RE-SEARCH – Transparente Entsorgungswege" />

    <mat-card class="karte login-karte">
      <mat-card-header>
        <h1 mat-card-title id="login-ueberschrift">Anmelden</h1>
      </mat-card-header>

      <form (submit)="$event.preventDefault(); submit()">
        <mat-card-content class="formular">
          <mat-form-field appearance="outline">
            <mat-label>E-Mail</mat-label>
            <input matInput type="email" [formField]="loginForm.email" autocomplete="username" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Passwort</mat-label>
            <input
              matInput
              data-testid="login-passwort"
              [type]="passwortSichtbar() ? 'text' : 'password'"
              [formField]="loginForm.passwort"
              autocomplete="current-password"
            />
            <button
              matIconButton
              matSuffix
              type="button"
              data-testid="passwort-sichtbarkeit"
              [attr.aria-label]="passwortSichtbar() ? 'Passwort verbergen' : 'Passwort anzeigen'"
              (click)="passwortSichtbarkeitUmschalten()"
            >
              <mat-icon>{{ passwortSichtbar() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          @if (fehler()) {
            <p class="fehler" role="alert">{{ fehler() }}</p>
          }
        </mat-card-content>

        <mat-card-actions align="end">
          <a matButton routerLink="/passwort-vergessen">Passwort vergessen</a>
          <button matButton="filled" type="submit" [disabled]="!loginForm().valid() || wirdGeladen()">Login</button>
        </mat-card-actions>
      </form>
    </mat-card>
  </div>
</main>
