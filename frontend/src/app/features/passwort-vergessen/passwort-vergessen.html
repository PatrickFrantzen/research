<main class="seite seite-zentriert">
  <mat-card class="karte">
    <mat-card-header>
      <h1 mat-card-title>Passwort vergessen</h1>
    </mat-card-header>

    @if (angefordert()) {
      <mat-card-content>
        <p role="status" appFokusBeiAnzeige>
          Falls ein Account mit dieser E-Mail existiert, wurde ein Link zum Setzen eines neuen Passworts versendet.
        </p>
      </mat-card-content>
      <mat-card-actions align="end">
        <a matButton routerLink="/login">Zurück zum Login</a>
      </mat-card-actions>
    } @else {
      <form (submit)="$event.preventDefault(); submit()">
        <mat-card-content class="formular">
          <mat-form-field appearance="outline">
            <mat-label>E-Mail</mat-label>
            <input matInput type="email" [formField]="passwortVergessenForm.email" autocomplete="username" />
          </mat-form-field>
        </mat-card-content>

        <mat-card-actions align="end">
          <a matButton routerLink="/login">Zurück zum Login</a>
          <button matButton="filled" type="submit" [disabled]="!passwortVergessenForm().valid() || wirdGeladen()">
            Link anfordern
          </button>
        </mat-card-actions>
      </form>
    }
  </mat-card>
</main>
