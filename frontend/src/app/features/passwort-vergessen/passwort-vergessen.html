<div class="seite">
  <mat-card class="karte">
    <h1>Passwort vergessen</h1>

    @if (angefordert()) {
      <p>
        Falls ein Account mit dieser E-Mail existiert, wurde ein Link zum
        Setzen eines neuen Passworts versendet.
      </p>
    } @else {
      <form (submit)="$event.preventDefault(); submit()">
        <mat-form-field appearance="outline">
          <mat-label>E-Mail</mat-label>
          <input matInput type="email" [formField]="passwortVergessenForm.email" autocomplete="username" />
        </mat-form-field>

        <div class="aktionen">
          <a routerLink="/login">Zurück zum Login</a>
          <button matButton="filled" type="submit" [disabled]="!passwortVergessenForm().valid() || wirdGeladen()">
            Link anfordern
          </button>
        </div>
      </form>
    }
  </mat-card>
</div>
