<div class="seite">
  <mat-card class="karte">
    <h1>Wareneintrag erfassen</h1>

    @if (angelegt()) {
      <p>Wareneintrag wurde angelegt.</p>
      <div class="aktionen">
        <button matButton="filled" type="button" (click)="weitererEintrag()">Weiteren Eintrag erfassen</button>
      </div>
    } @else {
      <form (submit)="$event.preventDefault(); submit()">
        <input #fotoInput type="file" accept="image/*" (change)="onFotoAusgewaehlt($event)" hidden />
        <button matButton="outlined" type="button" (click)="fotoInput.click()">
          {{ foto ? 'Anderes Foto auswählen' : 'Foto aufnehmen oder auswählen' }}
        </button>
        @if (fotoVorschauUrl(); as url) {
          <img [src]="url" alt="Foto-Vorschau" class="foto-vorschau" />
        }

        <mat-form-field appearance="outline">
          <mat-label>AVV-Code</mat-label>
          <input
            matInput
            #avvSuche
            [matAutocomplete]="avvAuto"
            [formField]="wareneintragForm.avvSucheAnzeige"
            (input)="onAvvSucheEingabe(avvSuche.value)"
          />
          <mat-autocomplete #avvAuto="matAutocomplete" (optionSelected)="onAvvCodeAusgewaehlt($event)">
            @for (avvCode of avvTreffer.value(); track avvCode.id) {
              <mat-option [value]="avvCode.id">{{ avvCode.code }} – {{ avvCode.bezeichnung }}</mat-option>
            }
          </mat-autocomplete>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Freitext</mat-label>
          <textarea matInput [formField]="wareneintragForm.freitext" rows="4"></textarea>
        </mat-form-field>

        @if (fehler()) {
          <p class="fehler">{{ fehler() }}</p>
        }

        <div class="aktionen">
          <a routerLink="/">Abbrechen</a>
          <button matButton="filled" type="submit" [disabled]="!kannAbsenden || wirdGeladen()">Absenden</button>
        </div>
      </form>
    }
  </mat-card>
</div>
