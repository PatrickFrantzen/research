<div class="seite">
  <mat-card class="karte">
    <mat-card-header>
      <h1 mat-card-title>Einstellungen</h1>
    </mat-card-header>

    <mat-card-content>
      <app-lade-zustand [ressource]="eigeneDaten" meldung="Deine Daten konnten nicht geladen werden." />
      <app-lade-zustand [ressource]="standorte" meldung="Standorte konnten nicht geladen werden." />
    </mat-card-content>

    <form (submit)="$event.preventDefault(); submit()">
      <mat-card-content class="formular">
        <mat-form-field appearance="outline">
          <mat-label>Vorname</mat-label>
          <input matInput [formField]="einstellungenForm.vorname" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Nachname</mat-label>
          <input matInput [formField]="einstellungenForm.nachname" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Standort</mat-label>
          <mat-select [formField]="einstellungenForm.standortId">
            @for (standort of standortListe(); track standort.id) {
              <mat-option [value]="standort.id">{{ standort.name }}</mat-option>
            }
          </mat-select>
          @if (standorte.hasValue() && standortListe().length === 0) {
            <mat-hint>Es sind noch keine Standorte hinterlegt.</mat-hint>
          }
        </mat-form-field>

        @if (fehler()) {
          <p class="fehler" role="alert" appFokusBeiAnzeige>{{ fehler() }}</p>
        }
      </mat-card-content>

      <mat-card-actions align="end">
        <button matButton="filled" type="submit" [disabled]="!geladen() || !einstellungenForm().valid() || wirdGeladen()">
          Speichern
        </button>
      </mat-card-actions>
    </form>

    <!-- Auf Mobil gibt es keinen Footer, daher Impressum hier (Issue #21). -->
    <mat-card-actions>
      <a matButton class="impressum-link" routerLink="/impressum">Impressum</a>
    </mat-card-actions>
  </mat-card>
</div>
