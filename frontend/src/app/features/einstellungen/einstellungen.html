<div class="seite">
  <mat-card class="karte">
    <h1>Einstellungen</h1>

    <form (submit)="$event.preventDefault(); submit()">
      <mat-form-field appearance="outline">
        <mat-label>Vorname</mat-label>
        <input matInput [formField]="einstellungenForm.vorname" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Nachname</mat-label>
        <input matInput [formField]="einstellungenForm.nachname" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Standort</mat-label>
        <select matNativeControl [formField]="einstellungenForm.standortId">
          <option value="">Bitte wählen</option>
          @for (standort of standorte.value(); track standort.id) {
            <option [value]="standort.id">{{ standort.name }}</option>
          }
        </select>
      </mat-form-field>

      @if (gespeichert()) {
        <p class="erfolg">Änderungen gespeichert.</p>
      }
      @if (fehler()) {
        <p class="fehler">{{ fehler() }}</p>
      }

      <div class="aktionen">
        <button matButton="filled" type="submit" [disabled]="!einstellungenForm().valid() || wirdGeladen()">
          Speichern
        </button>
      </div>
    </form>

    <a class="impressum-link" routerLink="/impressum">Impressum</a>
  </mat-card>
</div>
