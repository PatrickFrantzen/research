<div class="seite">
  <mat-card class="karte">
    <h1>Nutzer anlegen</h1>

    @if (angelegt(); as ergebnis) {
      <p>Account für {{ ergebnis.email }} wurde angelegt.</p>
      <p>
        Initial-Zugang (an den Nutzer weitergeben, kein Mailversand):
        <code>{{ ergebnis.passwortSetzenLink }}</code>
      </p>
    } @else {
      <form (submit)="$event.preventDefault(); submit()">
        <mat-form-field appearance="outline">
          <mat-label>Vorname</mat-label>
          <input matInput [formField]="nutzerForm.vorname" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Nachname</mat-label>
          <input matInput [formField]="nutzerForm.nachname" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>E-Mail</mat-label>
          <input matInput type="email" [formField]="nutzerForm.email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Standort</mat-label>
          <select matNativeControl [formField]="nutzerForm.standortId">
            <option value="">Bitte wählen</option>
            @for (standort of standorte.value(); track standort.id) {
              <option [value]="standort.id">{{ standort.name }}</option>
            }
          </select>
        </mat-form-field>

        @if (fehler()) {
          <p class="fehler">{{ fehler() }}</p>
        }

        <div class="aktionen">
          <a routerLink="/">Abbrechen</a>
          <button matButton="filled" type="submit" [disabled]="!nutzerForm().valid() || wirdGeladen()">
            Anlegen
          </button>
        </div>
      </form>
    }
  </mat-card>
</div>
