<div class="seite">
  <mat-card class="karte">
    <h1>Passwort setzen</h1>

    <form (submit)="$event.preventDefault(); submit()">
      <mat-form-field appearance="outline">
        <mat-label>Neues Passwort</mat-label>
        <input
          matInput
          type="password"
          [formField]="passwortForm.neuesPasswort"
          autocomplete="new-password"
        />
      </mat-form-field>

      @if (fehler()) {
        <p class="fehler">{{ fehler() }}</p>
      }

      <div class="aktionen">
        <a routerLink="/login">Zurück zum Login</a>
        <button matButton="filled" type="submit" [disabled]="!passwortForm().valid() || wirdGeladen()">
          Passwort setzen
        </button>
      </div>
    </form>
  </mat-card>
</div>
