<main class="seite seite-zentriert">
  <mat-card class="karte">
    <mat-card-header>
      <h1 mat-card-title>Passwort setzen</h1>
    </mat-card-header>

    <form (submit)="$event.preventDefault(); submit()">
      <mat-card-content class="formular">
        <mat-form-field appearance="outline">
          <mat-label>Neues Passwort</mat-label>
          <input matInput type="password" [formField]="passwortForm.neuesPasswort" autocomplete="new-password" />
          <mat-hint>Mindestens 12 Zeichen</mat-hint>
        </mat-form-field>

        @if (fehler()) {
          <p class="fehler" role="alert">{{ fehler() }}</p>
        }
      </mat-card-content>

      <mat-card-actions align="end">
        <a matButton routerLink="/login">Zurück zum Login</a>
        <button matButton="filled" type="submit" [disabled]="!passwortForm().valid() || wirdGeladen()">
          Passwort setzen
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</main>
