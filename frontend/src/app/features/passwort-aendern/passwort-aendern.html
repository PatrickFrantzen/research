<main class="seite seite-zentriert">
  <mat-card class="karte">
    <mat-card-header>
      <h1 mat-card-title>Passwort ändern</h1>
    </mat-card-header>

    <form (submit)="$event.preventDefault(); submit()">
      <mat-card-content class="formular">
        <p>Du bist mit einem Initialpasswort angemeldet. Bitte lege jetzt ein eigenes Passwort fest.</p>

        <mat-form-field appearance="outline">
          <mat-label>Neues Passwort</mat-label>
          <input matInput type="password" [formField]="passwortForm.neuesPasswort" autocomplete="new-password" />
          <mat-hint>Mindestens 12 Zeichen</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Neues Passwort wiederholen</mat-label>
          <input matInput type="password" [formField]="passwortForm.wiederholung" autocomplete="new-password" />
          @if (wiederholung && !stimmtUeberein()) {
            <mat-hint data-testid="passwort-ungleich">Die Passwörter stimmen nicht überein.</mat-hint>
          }
        </mat-form-field>

        @if (fehler()) {
          <p class="fehler" role="alert" appFokusBeiAnzeige>{{ fehler() }}</p>
        }
      </mat-card-content>

      <mat-card-actions align="end">
        <button matButton type="button" (click)="abmelden()">Abmelden</button>
        <button matButton="filled" type="submit" [disabled]="!passwortForm().valid() || !stimmtUeberein() || wirdGeladen()">
          Passwort ändern
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</main>
