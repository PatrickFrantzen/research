# Produktiv-/Demo-Deployment auf einem Linux-VPS (z.B. IONOS VPS S+).
# Unterschied zu docker-compose.yml: kein Port-Publishing für app/minio
# (nur Caddy ist öffentlich erreichbar), NODE_ENV=production,
# TLS-Reverse-Proxy inklusive. Alle Secrets kommen aus ".env" (siehe
# .env.prod.example) statt aus unsicheren Defaults.
#
# Start: docker compose -f docker-compose.prod.yml up -d
# Siehe docs/research/03-docker-deployment-optionen.md für die
# Go-live-Checkliste (Backups, Firewall, Secrets).

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://research:${POSTGRES_PASSWORD}@postgres:5432/research
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: https://${FILES_DOMAIN}
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ACCESS_KEY_ID: research-app
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MINIO_APP_SECRET}
      OBJECT_STORAGE_BUCKET: research-fotos
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_ISSUER: ${JWT_ISSUER:-research-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-research-frontend}
      # Ohne SMTP_HOST werden Mails nur geloggt, siehe ADR-0006.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORT: ${SMTP_PASSWORT:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: https://${DOMAIN}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  redis:
    image: redis:8.8.2-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: research
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    environment:
      DATABASE_URL: postgres://research:${POSTGRES_PASSWORD}@postgres:5432/research
      INITIAL_NUTZER_EMAIL: ${INITIAL_NUTZER_EMAIL}
      INITIAL_NUTZER_PASSWORT: ${INITIAL_NUTZER_PASSWORT}
      INITIAL_NUTZER_STANDORT: Hauptsitz
    entrypoint: sh -c "npx prisma migrate deploy && npm run db:seed"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    # MinIO veröffentlicht keine Community-Images mehr, quay.io verlangt seit
    # 24.09.2026 Anmeldung (Issue #83). Chainguard baut MinIO aus dem Quellcode,
    # kostenlos nur als `latest`, daher per Digest gepinnt.
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    # Chainguard läuft standardmäßig als UID 65532; bestehende Volumes wurden
    # vom alten Image als root beschrieben, daher weiterhin root.
    user: "0:0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: research
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      bash -c "
        mc alias set local http://minio:9000 research ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/research-fotos &&
        (mc admin user add local research-app ${MINIO_APP_SECRET} || true) &&
        echo '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::research-fotos\",\"arn:aws:s3:::research-fotos/*\"]}]}' > /tmp/research-app-policy.json &&
        mc admin policy create local research-app-policy /tmp/research-app-policy.json &&
        mc admin policy attach local research-app-policy --user research-app
      "

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
